# NHS Data Dictionary - Table 2, TREATMENT FUNCTION CODE national codes.
# Source: https://www.datadictionary.nhs.uk/supporting_information/main_specialty_and_treatment_function_codes_table.html
# Copy of the page retrieved 2026-10-12.
# Generated by ingest/ingest_dd_table.py - do not edit by hand; re-run the script.
# A treatment function is the specialised service a patient is treated in.
# not_treatment_functions: codes Table 2 lists as "not a Treatment Function"
# (main-specialty-only codes), with the Data Dictionary comment where it gives one.

codes:
  - code: "100"
    title: "General Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES delivering surgical ACTIVITY not covered by other subspecialty areas. The majority of elective procedures, about 80 per cent, fall outside subspecialty areas. For further information, see: Royal College of Surgeons - Surgical Specialties"
  - code: "101"
    title: "Urology Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "Surgical SERVICES for the treatment of disorders of the urinary system and male reproductive system. This includes surgery for gender dysphoria. For further information, see: Royal College of Surgeons - Urology"
  - code: "102"
    title: "Transplant Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for pre- and post-operative care for major organ transplants except heart and lung. Excludes Cardiothoracic Transplantation Service - see TREATMENT FUNCTION CODE 174, corneal grafts carried out by Ophthalmology Service - see TREATMENT FUNCTION CODE 130 and Blood and Bone Marrow Transplantation Service - see TREATMENT FUNCTION CODE 308. For further information, see: Royal College of Surgeons - General Surgery"
  - code: "103"
    title: "Breast Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES which include surgical treatment for cancer, suspected neoplasms, indeterminate breast lesions, benign breast lumps, disorders of the nipple-areolar complex, cysts and post-cancer reconstructive, revision and symmetrising surgery. Includes breast surgery for gender dysphoria. Excludes cosmetic surgery. For further information, see: Association of Breast Surgery"
  - code: "104"
    title: "Colorectal Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for the surgical treatment of disorders of the lower intestine (colon, anus and rectum)"
  - code: "105"
    title: "Hepatobiliary and Pancreatic Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "Specialist surgical SERVICES for hepatobiliary and pancreatic (HPB) disorders. To be used by recognised specialist units and associated outreach SERVICES only. Excludes Transplant Surgery Service - see TREATMENT FUNCTION CODE 102. For further information, see: NHS England: Hepatobiliary and Pancreas"
  - code: "106"
    title: "Upper Gastrointestinal Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for surgical treatment of disorders of the upper parts of the gastrointestinal tract. For further information, see: Royal College of Surgeons - General Surgery"
  - code: "107"
    title: "Vascular Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for the surgical treatment of diseases of the vascular system. For further information, see: Royal College of Surgeons - Vascular Surgery"
  - code: "108"
    title: "Spinal Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "Surgery concentrating on specialised and complex treatment of issues of the back and spine. To be used by recognised specialist units and associated outreach SERVICES only. Excludes Trauma and Orthopaedic Service - see TREATMENT FUNCTION CODE 110, Orthopaedic Service - see TREATMENT FUNCTION CODE 111, Trauma Surgery Service - see TREATMENT FUNCTION CODE 115 and Spinal Injuries Service - see TREATMENT FUNCTION CODE 323. For further information, see: British Association of Spine Surgeons"
  - code: "109"
    title: "Bariatric Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES assessing, managing and treating obesity, and specifically consideration of bariatric (weight loss) surgery. It includes PATIENTS who are obese and have, or are at risk of, other medical conditions. It does not cover preventing a PERSON from becoming overweight or obese, or lifestyle weight management programmes for a PERSON who is overweight or obese. For further information, see: National Institute for Health and Care Excellence - Obesity"
  - code: "110"
    title: "Trauma and Orthopaedic Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES to treat injuries, congenital and acquired disorders of the bones, joints, and their associated soft tissues, including ligaments, nerves and muscles. Excludes Orthopaedic Surgery Service - TREATMENT FUNCTION CODE 111 and Spinal Surgery Service - see TREATMENT FUNCTION CODE 108. For major trauma centres use Trauma Surgery Service - see TREATMENT FUNCTION CODE 115. For further information, see: Royal College of Surgeons - Major Trauma Surgery and Royal College of Surgeons - Orthopaedic Surgery"
  - code: "111"
    title: "Orthopaedic Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for the elective or planned surgical assessment or treatment of the musculoskeletal system. Excludes Trauma Surgery Service - see TREATMENT FUNCTION CODE 115. Where there is no dedicated Orthopaedic Service use Trauma and Orthopaedic Service - see TREATMENT FUNCTION CODE 110. For further information, see: Royal College of Surgeons - Orthopaedic Surgery"
  - code: "113"
    title: "Endocrine Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for the surgical treatment of diseases of the thyroid and/or other endocrine glands. For further information, see: Royal College of Surgeons - General Surgery"
  - code: "115"
    title: "Trauma Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "Major trauma specialist SERVICES at a designated unit, with the specific exclusion of Spinal Surgery Service - see TREATMENT FUNCTION CODE 108. Excludes elective or planned Orthopaedic Surgery Service - see TREATMENT FUNCTION CODE 111. Where there is no major trauma centre use Trauma and Orthopaedics Service - see TREATMENT FUNCTION CODE 110. For further information, see: Royal College of Surgeons - Major Trauma Surgery"
  - code: "120"
    title: "Ear Nose and Throat Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "Formerly known as ENT. Surgical SERVICES for the assessment, diagnosis, management and treatment of ear, nose and/or throat issues. Excludes Audiology Service - see TREATMENT FUNCTION CODE 840. For further information, see: Royal College of Surgeons - Ear, Nose & Throat (ENT)"
  - code: "130"
    title: "Ophthalmology Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "The surgical treatment of disorders and diseases of the eye. Excludes Medical Ophthalmology Service - see TREATMENT FUNCTION CODE 460 and Ophthalmic and Vision Science Service - see TREATMENT FUNCTION CODE 461. For further information, see: Royal College of Ophthalmologists"
  - code: "140"
    title: "Oral Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis and surgical treatment of diseases, injuries and defects of hard and soft tissues of the mouth. Excludes departments delivering a SERVICE where oral surgery and maxillofacial services are mixed (i.e. an out-patient clinic accepting oral surgery and maxillofacial surgery patients) - see TREATMENT FUNCTION CODE 145. For further information, see: British Association of Oral Surgeons Specialty Training Curriculum - Oral Surgery"
  - code: "141"
    title: "Restorative Dentistry Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES providing examination and treatment of diseases of the oral cavity, the teeth and their supporting structures. Restorative Dentistry includes the dental specialties of Endodontics, Periodontics and Prosthodontics (including implantology), and its foundation is based upon how these interact in the management of cases requiring multifaceted care. For further information, see: British Society for Restorative Dentistry"
  - code: "143"
    title: "Orthodontic Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for the treatment of malocclusions (improper bites). Orthodontic treatment can focus on dental displacement only, or can deal with the control and modification of facial growth. For further information, see: British Orthodontic Society"
  - code: "144"
    title: "Maxillofacial Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "Professional recommendation is to use Oral and Maxillofacial Surgery Service where this SERVICE is combined with oral surgery - see TREATMENT FUNCTION CODE 145. Alternatively, for oral surgery services only see TREATMENT FUNCTION CODE 140. This code has been retained for existing SERVICES which only provide maxillofacial surgery."
  - code: "145"
    title: "Oral and Maxillofacial Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "Combined SERVICES providing diagnosis and surgical treatment of diseases, injuries and defects involving hard and soft tissues of the mouth, jaws, and neck. These SERVICES may have formerly been categorised as TREATMENT FUNCTION CODE 140 (Oral Surgery Service) or TREATMENT FUNCTION CODE 144 (Maxillofacial Surgery Service). For further information, see: British Association of Oral & Maxillofacial Surgeons"
  - code: "150"
    title: "Neurosurgical Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "Surgical SERVICES for the treatment of disorders of the nervous system including the brain, spinal cord, peripheral nerves, and extra-cranial cerebrovascular system. Excludes Spinal Surgery Service - see TREATMENT FUNCTION CODE 108. For major trauma centres use Trauma Surgery Service - see TREATMENT FUNCTION CODE 115. For further information, see: Royal College of Surgeons - Neurosurgery"
  - code: "160"
    title: "Plastic Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES to correct or restore form and function. In addition to cosmetic or aesthetic surgery, plastic surgery includes many types of reconstructive surgery, and the treatment of burns. For care given within specialist burn services, use Burns Care Service - see TREATMENT FUNCTION CODE 161. Excludes breast surgery for gender dysphoria, use Breast Surgery Service - see TREATMENT FUNCTION CODE 103. For further information, see: Royal College of Surgeons - Plastic and Reconstructive"
  - code: "161"
    title: "Burns Care Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for the surgical and non-surgical treatment of burns within recognised specialist burns units and associated outreach SERVICES only. Whilst this does not signify the CRITICAL CARE LEVEL , many PATIENTS will also come within the scope of the Critical Care Minimum Data Set . For further information, see: British Burn Association"
  - code: "170"
    title: "Cardiothoracic Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES delivering surgical treatment of diseases affecting the heart and organs inside the thorax (the chest). Should only be used where there are no separate SERVICES for Cardiac Surgery and Thoracic Surgery. For further information, see: Royal College of Surgeons - Cardiothoracic Surgery"
  - code: "172"
    title: "Cardiac Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES delivering surgical treatment of diseases affecting the heart. Procedures are often lengthy and complex, requiring support from advanced forms of technology during surgery and CRITICAL CARE LEVEL 2 and 3 for the PATIENT after surgery. For further information, see: Royal College of Surgeons - Cardiothoracic Surgery"
  - code: "173"
    title: "Thoracic Surgery Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES providing surgical treatment of diseases affecting organs inside the thorax (the chest). Generally, treatment of conditions of the lungs, chest wall, and diaphragm. Predominantly this is surgical treatment of malignant disease or its effects. For further information, see: Royal College of Surgeons - Cardiothoracic Surgery"
  - code: "174"
    title: "Cardiothoracic Transplantation Service"
    heading: "Surgical Specialties"
    status: "active"
    comment: "SERVICES for pre- and post-operative care for heart and lung transplants. To be used by recognised specialist units and associated outreach services only. For further information, see: Royal College of Surgeons - Cardiothoracic Surgery"
  - code: "142"
    title: "Paediatric Dentistry Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for dentistry with appropriate facilities and support staff. For further information, see: The British Society of Paediatric Dentistry"
  - code: "171"
    title: "Paediatric Surgery Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for general surgery. For further information, see: Royal College of Surgeons - Paediatric Surgery"
  - code: "211"
    title: "Paediatric Urology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for surgical treatment of disorders of the urinary system and male reproductive system. For further information, see: British Association of Paediatric Surgeons - Urology"
  - code: "212"
    title: "Paediatric Transplantation Surgery Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for pre- and post-operative care for major organ transplants except heart and lung. Excludes Paediatric Cardiac Surgery Service - see TREATMENT FUNCTION CODE 221, Paediatric Thoracic Surgery Service - see TREATMENT FUNCTION CODE 222, corneal grafts carried out by Paediatric Ophthalmology Service - see TREATMENT FUNCTION CODE 216 and Blood and Bone Marrow Transplantation Service - see TREATMENT FUNCTION CODE 308. For further information, see: Royal College of Surgeons - General Surgery"
  - code: "213"
    title: "Paediatric Gastrointestinal Surgery Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for surgical treatment of disorders of the gastrointestinal tract. For further information, see: British Association of Paediatric Surgeons - Gastrointestinal"
  - code: "214"
    title: "Paediatric Trauma and Orthopaedic Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES to treat injuries, congenital and acquired disorders of the bones, joints, and their associated soft tissues, including ligaments, nerves and muscles. Excludes Trauma Surgery Service - see TREATMENT FUNCTION CODE 115 and Spinal Surgery Service - see TREATMENT FUNCTION CODE 108 For further information, see: British Society for Children's Orthopaedic Surgery (BSCOS)"
  - code: "215"
    title: "Paediatric Ear Nose and Throat Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's surgical SERVICES for the assessment, diagnosis, management and treatment of ear, nose and/or throat issues. Excludes Audiology Service - see TREATMENT FUNCTION CODE 840. For further information, see: British Association for Paediatric Otolaryngology"
  - code: "216"
    title: "Paediatric Ophthalmology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the surgical treatment of disorders and diseases of the eye. For further information, see: British & Irish Paediatric Ophthalmology and Strabismus Association"
  - code: "217"
    title: "Paediatric Oral and Maxillofacial Surgery Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES providing diagnosis and surgical treatment of diseases, injuries and defects involving hard and soft tissues of the mouth, jaws, and neck. Excludes Paediatric Dentistry Services - see TREATMENT FUNCTION CODE 142. For further information, see: British Association of Oral & Maxillofacial Surgeons"
  - code: "218"
    title: "Paediatric Neurosurgery Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the surgical treatment of disorders which affect any portion of the nervous system including the brain, spinal cord, peripheral nerves, and extra-cranial cerebrovascular system. For further information, see: Royal College of Surgeons - Neurosurgery"
  - code: "219"
    title: "Paediatric Plastic Surgery Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for correction or to restore form and function. In addition to cosmetic or aesthetic surgery, plastic surgery includes many types of reconstructive surgery, and the treatment of burns. For care given within specialist paediatric burn services, use Paediatric Burns Care Service - see TREATMENT FUNCTION CODE 220. For further information, see: NHS England: Specialised surgery in children"
  - code: "220"
    title: "Paediatric Burns Care Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the surgical and non-surgical treatment of burns within recognised specialist burns units and associated outreach SERVICES only. Whilst this does not signify the CRITICAL CARE LEVEL , many PATIENTS will also come within the scope of the Critical Care Minimum Data Set . For further information, see: British Burn Association"
  - code: "221"
    title: "Paediatric Cardiac Surgery Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the surgical treatment of the heart or great vessels. For further information, see: NHS England: E05. Congenital Heart Services"
  - code: "222"
    title: "Paediatric Thoracic Surgery Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the surgical treatment of diseases affecting organs inside the thorax (the chest). Generally, treatment of conditions of the lungs, chest wall, and diaphragm. For further information, see: British Association of Paediatric Surgeons - Thoracic"
  - code: "223"
    title: "Paediatric Epilepsy Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES by CONSULTANT paediatrician with expertise in epilepsy supported by specialist staff. For further information, see: Royal College of Paediatrics and Child Health - Epilepsy"
  - code: "230"
    title: "Paediatric Clinical Pharmacology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES providing advice and support locally and nationally regarding the introduction of new medicines, adverse drug reactions, poisoning and toxicity, and prescribing policies. For further information, see: Royal College of Paediatrics and Child Health - Drugs and medicines"
  - code: "240"
    title: "Paediatric Palliative Medicine Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES improving the quality of life of PATIENTS and their families facing the problems associated with life-limiting illness. Prevention and relief of suffering by means of early identification, assessment and treatment of pain and other problems, physical, psychosocial and spiritual. For further information, see: Royal College of Paediatrics and Child Health - Palliative care"
  - code: "241"
    title: "Paediatric Pain Management Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for complex pain disorders requiring diagnosis and treatment by a specialist Multidisciplinary Team . For further information, see: Royal College of Paediatrics and Child Health - Pain management"
  - code: "242"
    title: "Paediatric Intensive Care Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES only to be used by designated Paediatric Intensive Care Units. For further information, see: Royal College of Paediatrics and Child Health - Intensive care medicine"
  - code: "250"
    title: "Paediatric Hepatology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the treatment of disease of the liver. For further information, see: Royal College of Paediatrics and Child Health - Hepatology"
  - code: "251"
    title: "Paediatric Gastroenterology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the treatment of disorders of the digestive system. For further information, see: Royal College of Paediatrics and Child Health - Gastroenterology"
  - code: "252"
    title: "Paediatric Endocrinology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the treatment of disorders of the endocrine system. Excludes Paediatric Diabetes Service - see TREATMENT FUNCTION CODES 263. For further information, see: British Society for Paediatric Endocrinology and Diabetes"
  - code: "253"
    title: "Paediatric Clinical Haematology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES contributing to the diagnosis and management of diseases of the blood and bone marrow. May be consultative in other specialties including intensive care. Excludes Anticoagulant Service - see TREATMENT FUNCTION CODE 324. For further information, see: NHS England: Paediatric haematology"
  - code: "254"
    title: "Paediatric Audio Vestibular Medicine Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the investigation, diagnosis and management of patients with disorders of balance, hearing, tinnitus and auditory communication. Excludes Audiology Service - see TREATMENT FUNCTION CODE 840. For further information, see: British Association of Paediatricians in Audiology"
  - code: "255"
    title: "Paediatric Clinical Immunology and Allergy Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the treatment of disorders of the immune system and allergic disease. For further information, see: Royal College of Paediatrics and Child Health - Paediatric allergy, immunology and infectious diseases - sub-specialty"
  - code: "256"
    title: "Paediatric Infectious Diseases Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the diagnosis and treatment of contagious or communicable diseases. For further information, see: Royal College of Paediatrics and Child Health - Paediatric allergy, immunology and infectious diseases - sub-specialty"
  - code: "257"
    title: "Paediatric Dermatology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the treatment of diseases of the skin. For further information, see: The British Society for Paediatric Dermatology (BSPD)"
  - code: "258"
    title: "Paediatric Respiratory Medicine Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the diagnosis and treatment of respiratory conditions. Also known as Thoracic Medicine and Pulmonary Medicine. For further information, see: Royal College of Paediatrics and Child Health - Paediatric respiratory medicine - sub-specialty"
  - code: "259"
    title: "Paediatric Nephrology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the diagnosis and treatment of kidney conditions and abnormalities. Also known as Renal Medicine. For further information, see: Royal College of Paediatrics and Child Health - Nephrology"
  - code: "260"
    title: "Paediatric Medical Oncology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the diagnosis and treatment, typically with Chemotherapy , of PATIENTS with cancer. For further information, see: Royal College of Paediatrics and Child Health - Oncology"
  - code: "261"
    title: "Paediatric Inherited Metabolic Medicine Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Formerly known as Paediatric Metabolic Disease. Dedicated children's SERVICES for the diagnosis and management of inherited metabolic conditions utilising biochemistry and metabolic characteristics requiring the expertise of both the physician and chemical pathologist. For further information, see: Royal College of Paediatrics and Child Health - Inherited metabolic medicine"
  - code: "262"
    title: "Paediatric Rheumatology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES incorporating the investigation, multidisciplinary holistic management and rehabilitation of PATIENTS with a wide spectrum of disorders of the musculoskeletal system encompassing the locomotor apparatus, bone and connective tissues and blood vessels. For further information, see: Royal College of Paediatrics and Child Health - Rheumatology"
  - code: "263"
    title: "Paediatric Diabetes Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Formerly known as Paediatric Diabetes Medicine. Dedicated children's SERVICES for the diagnosis, treatment and support of PATIENTS with diabetes. For further information, see: Royal College of Paediatrics and Child Health - Diabetes"
  - code: "264"
    title: "Paediatric Cystic Fibrosis Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated multidisciplinary children's SERVICES concerned with the diagnosis, assessment and management of PATIENTS with cystic fibrosis. This TREATMENT FUNCTION CODE should be used by recognised specialist centres only. For further information, see: NHS England: Specialised respiratory"
  - code: "270"
    title: "Paediatric Emergency Medicine Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES to care for PATIENTS with urgent problems delivered as part of an Emergency Care Attendance . Excludes Trauma Surgery Service - see TREATMENT FUNCTION CODE 115. For further information, see: Royal College of Paediatrics and Child Health - Emergency Medicine"
  - code: "280"
    title: "Paediatric Interventional Radiology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the diagnosis and treatment of diseases utilising minimally invasive image-guided procedures. Not to be used for Diagnostic Imaging Service - see TREATMENT FUNCTION CODE 812. For further information, see: British Society of Interventional Radiology - What is Interventional Radiology"
  - code: "290"
    title: "Community Paediatric Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "SERVICES providing assessment and care to vulnerable children, including those with developmental disorders and disabilities, complex behavioural presentations, and those at risk of abuse or are being abused. Excludes Paediatric Neurodisability Service - see TREATMENT FUNCTION CODE 291. For further information, see: Royal College of Paediatrics and Child Health - Community child health - sub-specialty"
  - code: "291"
    title: "Paediatric Neurodisability Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for the diagnosis and treatment of Cerebral Palsy and non-progressive handicapping neurological conditions, with or without Learning Disability / Intellectual Disability . For further information, see: Royal College of Paediatrics and Child Health - Neurodisability"
  - code: "321"
    title: "Paediatric Cardiology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for diseases and abnormalities of the heart. Excludes Congenital Heart Disease Service - see TREATMENT FUNCTION CODE 331. For further information, see: Joint Royal Colleges of Physicians Training Board - Paediatric Cardiology"
  - code: "421"
    title: "Paediatric Neurology Service"
    heading: "Other Children's Specialist Services"
    status: "active"
    comment: "Dedicated children's SERVICES for diagnosis, management and medical treatment of conditions and diseases of the central nervous system, with appropriate facilities and support staff. Excludes Paediatric Epilepsy Service - see TREATMENT FUNCTION CODE 223. For further information, see: Royal College of Paediatrics and Child Health - Neurology"
  - code: "180"
    title: "Emergency Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Accident & Emergency. SERVICES to care for PATIENTS with urgent problems delivered as part of an Emergency Care Attendance . Excludes Trauma Surgery Service - see TREATMENT FUNCTION CODE 115. For further information, see: The Royal College of Emergency Medicine"
  - code: "190"
    title: "Anaesthetic Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for PATIENTS being assessed for anaesthesia, as well as the provision of sedation and anaesthesia for patients undergoing interventional radiology and radiotherapy. This can be used in out-patients only. Pain Management Service should be recorded in TREATMENT FUNCTION CODE 191. Intensive Care Medicine Service should be recorded in TREATMENT FUNCTION CODE 192. For further information, see: Royal college of Anaesthetists - Anaesthetists"
  - code: "191"
    title: "Pain Management Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for complex pain disorders requiring diagnosis and treatment by a specialist Multidisciplinary Team"
  - code: "192"
    title: "Intensive Care Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Critical Care Medicine. SERVICES using a body of specialist knowledge and practice concerned with the treatment of PATIENTS , with, at risk of, or recovering from potentially life-threatening failure of one or more of the body's organ systems. It includes the provision of organ system support, the investigation, diagnosis, and treatment of acute illness, systems management and PATIENT safety, ethics, end-of-life care, and the support of families. Typically, this will refer to CRITICAL CARE LEVEL 2 and 3 beds within the scope of the Critical Care Minimum Data Set . For further information, see: Faculty of Intensive Care Medicine"
  - code: "200"
    title: "Aviation and Space Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Also known as Aerospace Medicine Services. Aviation and Space Medicine SERVICES study all factors affecting the PERSON in flight. This may include pre-flight preparation and checks as well as inflight care to minimise the potentially harmful effects of their abnormal environment. For further information, see: Royal College of Physicians - Aviation and Space Medicine"
  - code: "300"
    title: "General Internal Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as General Medicine. SERVICES include adults admitted as emergencies with acute medical problems, including multiple disorders. PATIENTS with problems that are not clearly within the remit of a particular medical specialty are referred for the opinion of a general physician. For further information, see: Joint Royal Colleges of Physicians Training Board - General Internal Medicine (GIM)"
  - code: "301"
    title: "Gastroenterology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Screening, diagnostic and therapeutic endoscopy SERVICES including upper and lower gastrointestinal (GI) endoscopy and hepatobiliary endoscopy. Excludes Hepatology Service - see TREATMENT FUNCTION CODE 306."
  - code: "302"
    title: "Endocrinology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "The treatment of disorders of the endocrine system, excluding specific Diabetes Services - see TREATMENT FUNCTION CODE 307. For further information, see: Joint Royal Colleges of Physicians Training Board - Endocrinology and Diabetes Mellitus"
  - code: "303"
    title: "Clinical Haematology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES contributing to the diagnosis and management of diseases of the blood and bone marrow. May be consultative in other specialties including intensive care. Excludes Anticoagulant Service - see TREATMENT FUNCTION CODE 324. For further information, see: Joint Royal Colleges of Physicians Training Board - Haematology"
  - code: "304"
    title: "Clinical Physiology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Physiological measurement. Excludes Clinical Neurophysiology Service - see TREATMENT FUNCTION CODE 401, Audiology Service - see TREATMENT FUNCTION CODE 840, Respiratory Physiology Service - see TREATMENT FUNCTION CODE 341, Cardiac Physiology Service - see TREATMENT FUNCTION CODE 675, Gastrointestinal Physiology Service - see TREATMENT FUNCTION CODE 677, Urological Physiology Service - see TREATMENT FUNCTION CODE 670, Vascular Physiology Service - see TREATMENT FUNCTION CODE 673 and Ophthalmic and Vision Science - see TREATMENT FUNCTION CODE 461. For further information, see: The Registration Council for Clinical Physiologists"
  - code: "305"
    title: "Clinical Pharmacology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES undertaking and interpreting clinical investigations including clinical trials; optimising the therapeutic use of drugs; detection and analysis of adverse drug effects; contribution to medicines evaluation and management of poisoning. For further information, see: Joint Royal Colleges of Physicians Training Board - Clinical Pharmacology and Therapeutics (CPT)"
  - code: "306"
    title: "Hepatology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Medical SERVICES for the diagnosis and treatment of liver disease. Also known as liver medicine. For hepatobiliary endoscopy, use Gastroenterology Service - see TREATMENT FUNCTION CODE 301"
  - code: "307"
    title: "Diabetes Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Diabetes Medicine. SERVICES to diagnose, treat and support PATIENTS with diabetes. For further information, see: Joint Royal Colleges of Physicians Training Board - Endocrinology and Diabetes Mellitus"
  - code: "308"
    title: "Blood and Marrow Transplantation Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES recognised as specialist units and associated outreach services only. Includes pre- and post-operative specialised services for autologous, allogeneic or syngeneic Blood and Marrow Transplantation. For further information, see: British Society of Blood and Marrow Transplantation"
  - code: "309"
    title: "Haemophilia Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Specialist SERVICES for the diagnosis, treatment and management of haemophilia. For further information, see: NHS England: Blood and infection"
  - code: "310"
    title: "Audio Vestibular Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Audiological Medicine. SERVICES concerned with the diagnosis and management of hearing and balance disorders, for example tinnitus, dysacusis and communication disorders. Rehabilitative/habilitative care is delivered by Multidisciplinary Teams and is aimed at improving the well-being and quality of life of the PATIENT concerned. Excludes Audiology Service - see TREATMENT FUNCTION CODE 840. For further information, see: Joint Royal College of Physicians Training Board - Audio vestibular Medicine"
  - code: "311"
    title: "Clinical Genetics Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis and management of genetic disorders affecting individuals and their families. For further information, see: Clinical Genetics"
  - code: "313"
    title: "Clinical Immunology and Allergy Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis and management of PATIENTS with diseases resulting from disordered immunological mechanisms, and allergic disease (abnormal immune responses to external substances). Should only be used where there are no separate SERVICES for Clinical Immunology and Allergy. For separate services - See Clinical Immunology Service - TREATMENT FUNCTION CODE 316 and Allergy Service - TREATMENT FUNCTION CODE 317. For further information, see: Welcome to the British Society for Allergy & Clinical Immunology (BSACI)"
  - code: "314"
    title: "Rehabilitation Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Rehabilitation Service. SERVICES for the prevention, diagnosis, treatment and rehabilitation management of disabling conditions. Rehabilitation medicine is broadly divided into neurological rehabilitation, spinal cord injury, limb loss and prosthetics and/or musculoskeletal rehabilitation. Excludes Mental Health Recovery and Rehabilitation Service - see TREATMENT FUNCTION CODE 725, Cardiac Rehabilitation Service - see TREATMENT FUNCTION CODE 327, Pulmonary Rehabilitation Service - see TREATMENT FUNCTION CODE 342, Orthotics Service - See TREATMENT FUNCTION CODE 658 or Prosthetics Service - see TREATMENT FUNCTION CODE 657. For further information, see: Joint Royal Colleges of Physicians Training Board - Rehabilitation medicine"
  - code: "315"
    title: "Palliative Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES improving the quality of life of PATIENTS and their families facing the problems associated with life-limiting illness and end of life care. Prevention and relief of suffering by means of early identification, assessment and treatment of pain and other physical, psychosocial and spiritual problems. For further information, see: Joint Royal Colleges of Physicians Training Board - Palliative Medicine"
  - code: "316"
    title: "Clinical Immunology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis and management of PATIENTS with diseases resulting from disordered immunological mechanisms, and conditions in which immunological manipulations form an important part of therapy. Allergy SERVICES should be recorded against Allergy Service - see TREATMENT FUNCTION CODE 317. For further information, see: Joint Royal College of Physicians Training Board - Immunology"
  - code: "317"
    title: "Allergy Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis and management of allergic disease (abnormal immune responses to external substances) and the exclusion of allergic causes in other conditions. For further information, see: Joint Royal College of Physicians Training Board - Allergy"
  - code: "318"
    title: "Intermediate Care Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES encompassing a range of multidisciplinary approaches, designed to safeguard independence by maximising rehabilitation and recovery after illness or injury. For further information, see: National Institute for Health and Care Excellence - Understanding intermediate care, including reablement"
  - code: "319"
    title: "Respite Care Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES providing temporary care of a dependant PERSON , providing relief for their usual caregivers"
  - code: "320"
    title: "Cardiology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for PATIENTS with heart disease covering a wide range of clinical activities. Management can involve interventional treatment, cardiac imaging, preventative and therapeutic options. This includes both diagnostic and interventional procedures in the cardiac catheterisation laboratory. For further information, see: Royal College of Physicians - Cardiology"
  - code: "322"
    title: "Clinical Microbiology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis, management and treatment of PATIENTS with diseases caused by bacteria, viruses, fungi and parasites."
  - code: "323"
    title: "Spinal Injuries Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for non-surgical management of issues of the back and spine. To be used by recognised specialist units and associated outreach SERVICES only. Excludes Spinal Surgery Service - see TREATMENT FUNCTION CODE 108"
  - code: "324"
    title: "Anticoagulant Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES providing the monitoring and control of anticoagulant therapy, including the initiation and/or supervision of oral anticoagulant therapy and the determination of anticoagulant dosage. This can be used in out-patients only"
  - code: "325"
    title: "Sport and Exercise Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Specific SERVICES providing diagnosis and management of medical problems caused by physical activity, the prevention of related injury and disease and the role of exercise in disease treatment. Excludes Trauma and Orthopaedic Service - see TREATMENT FUNCTION CODE 110, Orthopaedic Surgery Service - see TREATMENT FUNCTION CODE 111, and Trauma Surgery Service - see TREATMENT FUNCTION CODE 115. For further information, see: Joint Royal Colleges of Physicians Training Board - Sport and Exercise Medicine"
  - code: "326"
    title: "Acute Internal Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES concerned with the assessment, diagnosis and management of adults presenting to secondary care with acute medical illness. For further information, see: Acute Internal Medicine"
  - code: "327"
    title: "Cardiac Rehabilitation Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for PATIENTS recovering from heart-related conditions such as heart attacks or procedures such as coronary artery bypass surgery to ensure that they achieve their full potential in terms of physical and psychological health"
  - code: "328"
    title: "Stroke Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for diagnosis, investigation, treatment and care of stroke PATIENTS . Excludes out-patients for Transient Ischaemic Attack Service - see TREATMENT FUNCTION CODE 329. For further information, see: Joint Royal Colleges of Physicians Training Board - Stroke Medicine (sub-specialty)"
  - code: "329"
    title: "Transient Ischaemic Attack Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "A multidisciplinary out-patient SERVICE for rapid diagnosis and treatment of PATIENTS presenting with suspected Transient Ischaemic Attack and mini-strokes to minimise the chance of a full stroke occurring and maximise the chances of independent living after a stroke. For further information, see: National Institute for Health and Care Excellence - Stroke and transient ischaemic attack"
  - code: "330"
    title: "Dermatology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the treatment of diseases of the skin. For further information, see: Joint Royal Colleges of Physicians Training Board - Dermatology"
  - code: "331"
    title: "Congenital Heart Disease Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "The management and treatment of congenital heart disease, including the ongoing care of children into adulthood. For further information, see: Joint Royal Colleges of Physicians Training Board - Paediatric cardiology"
  - code: "333"
    title: "Rare Disease Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for rare diseases, many of which are present at birth and are either caused by a genetic problem or deficiencies or exposures to substances around the time of conception or during pregnancy. This TREATMENT FUNCTION CODE should be used by designated specialist centres only. For further information, see: National Congenital Anomaly and Rare Disease Registration Service"
  - code: "335"
    title: "Inherited Metabolic Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis and management of inherited metabolic conditions utilising biochemistry and metabolic characteristics requiring the expertise of both the physician and chemical pathologist. For further information, see: Joint Royal Colleges of Physicians Training Board - Metabolic Medicine"
  - code: "340"
    title: "Respiratory Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Respiratory Medicine is also known as Thoracic Medicine and Pulmonary Medicine. SERVICES for the investigation, diagnosis, management and treatment of PATIENTS with respiratory complaints. Excludes acute respiratory failure and adult respiratory distress syndrome (ARDS) - see Intensive Care Medicine Service TREATMENT FUNCTION CODE 192 and Respiratory Physiology Service - see TREATMENT FUNCTION CODE 341. For further information, see: Joint Royal Colleges of Physicians Training Board - Respiratory Medicine"
  - code: "341"
    title: "Respiratory Physiology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the physiological measurement of the function of the respiratory system. Excludes Sleep Medicine Service - see TREATMENT FUNCTION CODE 347. For further information, see: Association for Respiratory Technology & Physiology"
  - code: "342"
    title: "Pulmonary Rehabilitation Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Programmed Pulmonary Rehabilitation. A multidisciplinary SERVICE for PATIENTS with chronic respiratory impairment. For further information, see: NHS England: Pulmonary rehabilitation"
  - code: "343"
    title: "Adult Cystic Fibrosis Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Multidisciplinary SERVICE concerned with the diagnosis, assessment and management of PATIENTS with cystic fibrosis. This TREATMENT FUNCTION CODE should be used by designated specialist centres only. For further information, see: NHS England: Specialised Respiratory"
  - code: "344"
    title: "Complex Specialised Rehabilitation Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "This TREATMENT FUNCTION CODE will be removed from use in a future release of the Information Standard. No new services should use this code in submissions. Complex specialised rehabilitation SERVICE which meets the NHS Specialised Services Rehabilitation Services' criteria and is registered as a Level 1 service"
  - code: "345"
    title: "Specialist Rehabilitation Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "This TREATMENT FUNCTION CODE will be removed from use in a future release of the Information Standard. No new services should use this code in submissions. Specialist rehabilitation SERVICE which meets the NHS Specialised Services Rehabilitation Services' criteria and is registered as a Level 2a service."
  - code: "346"
    title: "Local Specialist Rehabilitation Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "This TREATMENT FUNCTION CODE will be removed from use in a future release of the Information Standard. No new services should use this code in submissions. Local specialist rehabilitation SERVICE which meets the NHS Specialised Services Rehabilitation Services' criteria and is registered as a Level 2b service."
  - code: "347"
    title: "Sleep Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES providing diagnosis and management of sleep disorders including parasomnias, excessive daytime sleepiness and sleep apnoea. For further information, see: Royal Society of Medicine - Sleep Medicine Section"
  - code: "348"
    title: "Post-COVID-19 Syndrome Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Multidisciplinary SERVICES for PATIENTS experiencing long-term health effects following COVID-19 infection, whether or not this was diagnosed at the time of acute illness or the patient was initially asymptomatic. Post-COVID-19 syndrome has also been known as 'long COVID'. For further information, see: National Institute for Health and Care Excellence - COVID-19 guideline: management of the long-term effects of COVID-19 and NHS England and NHS Improvement coronavirus - National guidance for post-COVID syndrome assessment clinics"
  - code: "350"
    title: "Infectious Diseases Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis, management and treatment of infectious diseases. Excludes Tropical Medicine Service - see TREATMENT FUNCTION CODE 352. For further information, see: Joint Royal Colleges of Physicians Training Board - Infectious Diseases"
  - code: "352"
    title: "Tropical Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis, management and treatment of diseases that are found most often in tropical or sub-tropical regions. This TREATMENT FUNCTION CODE should be used by designated specialist centres only. Excludes Infectious Diseases Service - see TREATMENT FUNCTION CODE 350. For further information, see: Joint Royal Colleges of Physicians Training Board - Infectious Diseases and Tropical Medicine"
  - code: "360"
    title: "Genitourinary Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the investigation and management of sexually transmitted infections and HIV. For further information, see: Joint Royal Colleges of Physicians Training Board - Genitourinary Medicine (GUM)"
  - code: "361"
    title: "Renal Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Nephrology. SERVICES for PATIENTS with acute renal failure and chronic kidney disease requiring long term care with the help of a Multidisciplinary Team . Most general medical problems in PATIENTS with kidney disease are managed by the Renal Medicine Service. Excludes acute renal replacement therapy in the critical care setting, see Intensive Care Medicine Service - TREATMENT FUNCTION CODE 192. For further information, see: Joint Royal Colleges of Physicians Training Board - Renal Medicine"
  - code: "370"
    title: "Medical Oncology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the specialised assessment and management of PATIENTS with cancer using chemotherapy. Includes treatment option discussions with PATIENTS , supervision of therapy and management of any complications of disease and/or treatment that may arise. For further information, see: Joint Royal Colleges of Physicians Training Board - Medical Oncology"
  - code: "371"
    title: "Nuclear Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES responsible for administration of unsealed radioactive substances to PATIENTS for the purposes of diagnosis, therapy or research. For further information, see: Joint Royal Colleges of Physicians Training Board - Nuclear Medicine"
  - code: "400"
    title: "Neurology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis, management and medical treatment of neurological conditions. Excludes Stroke Medicine Service - TREATMENT FUNCTION CODE 328, out-patients for Transient Ischaemic Attack Service - see TREATMENT FUNCTION CODE 329. For further information, see: Joint Royal Colleges of Physicians Training Board - Neurology"
  - code: "401"
    title: "Clinical Neurophysiology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Primarily diagnostic SERVICE concerned with recording electrical activity from the nervous system to aid diagnosis, classification and management of neurological disease. Includes Electroencephalogram (EEG) and Electromyography (EMG). For further information, see: Joint Royal College of Physicians - Clinical Neurophysiology"
  - code: "410"
    title: "Rheumatology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES incorporating the investigation, holistic management and rehabilitation of PATIENTS with a wide spectrum of disorders of the musculoskeletal system encompassing the locomotor apparatus, bone and connective tissues and blood vessels. For further information, see: Joint Royal College of Physicians - Rheumatology"
  - code: "420"
    title: "Paediatric Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Dedicated children's SERVICES for the treatment of patients typically aged 0 to 18 for medical conditions, however the environments and other members of the multidisciplinary service are likely to care for surgical PATIENTS too. For further information, see: Royal College of Paediatrics and Child Health - General paediatrics - specialty level training"
  - code: "422"
    title: "Neonatal Critical Care Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Neonatology. SERVICES providing care for all babies that require on-going, enhanced medical care following birth. Neonatal critical care SERVICES are provided in a variety of settings dependent upon the interventions required for the baby and with dedicated transport services to support babies being transferred to and from neonatal care units. Use when NEONATAL LEVEL OF CARE = 1, 2 or 3. Includes Special Care Baby Units (SCBU), Local Neonatal Units (LNU) and Neonatal Intensive Care Units (NICU). Any readmission would be to Paediatric Service - see TREATMENT FUNCTION CODE 420, or Paediatric Intensive Care Service - see TREATMENT FUNCTION CODE 242. For further information, see: Royal College of Paediatrics and Child Health - Neonatal medicine - sub-specialty and NHS England - E08. Neonatal Critical Care"
  - code: "424"
    title: "Well Baby Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for healthy infants born and referenced by the Maternity record who do not require any intervention other than health screening and prophylactic healthcare. General care given by the mother/substitute with healthcare education if needed. Use when NEONATAL LEVEL OF CARE = 0 - Normal Care . Excludes Neonatal Critical Care Service - see TREATMENT FUNCTION CODE 422"
  - code: "430"
    title: "Elderly Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Formerly known as Geriatric Medicine. SERVICES to treat diseases and disabilities in older adults, particularly those with multiple morbidities. There is no set age at which PATIENTS may be under the care of the Elderly Medicine Service, this decision should be determined by the individual PATIENT 's needs. For further information, see: Joint Royal Colleges of Physicians Training Board - Geriatric Medicine"
  - code: "431"
    title: "Orthogeriatric Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Multidisciplinary SERVICES addressing clinical and social needs in the management of PATIENTS with fragility fractures, including hip fractures. The care provided aims to be holistic and to include secondary prevention of fractures as well as acute care. For further information, see: GM - Orthogeriatrics"
  - code: "450"
    title: "Dental Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for dental treatment carried out in a hospital setting. Includes Oral Medicine. For further information, see: British Dental Association"
  - code: "451"
    title: "Special Care Dentistry Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES concerned with the improvement of the oral health of PATIENTS and groups in society who have a physical, sensory, intellectual, mental, medical, emotional or social impairment or DISABILITY or, more often, a combination of these factors. The specialty focuses on adolescents and adults only and includes the important period of transition as the adolescent moves into adulthood. For further information, see: Special Care Dentistry Association (SCDA)"
  - code: "460"
    title: "Medical Ophthalmology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Medically-led SERVICES including assessment, investigation, diagnosis and management of inflammatory, vascular and neurological disorders affecting vision. May include public health screening, for example diabetic retinopathy screening. For further information, see: Joint Royal Colleges of Physicians Training Board - Medical Ophthalmology"
  - code: "461"
    title: "Ophthalmic and Vision Science Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES providing physiological measurement of the function of the eye and vision. Includes diagnostic electrophysiology of vision, imaging and biometry. For further information, see: NHS Health Education England: Ophthalmic and vision science"
  - code: "501"
    title: "Obstetrics Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES managing high risk pregnancy and childbirth including miscarriages and stillbirths but specifically excluding planned terminations. Excludes Midwifery Service - see TREATMENT FUNCTION CODE 560. For further information, see: Royal College of Obstetricians & Gynaecologists - Obstetrics and Gynaecology"
  - code: "502"
    title: "Gynaecology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES for the diagnosis, management and treatment of disorders of the female reproductive system. Includes planned terminations of pregnancy. For further information, see: Royal College of Obstetricians & Gynaecologists - Obstetrics and Gynaecology"
  - code: "503"
    title: "Gynaecological Oncology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES to treat cancers of the female reproductive system, principally involving surgical members of the Multidisciplinary Team . For further information, see: British Gynaecological Cancer Society"
  - code: "504"
    title: "Community Sexual and Reproductive Health Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES supporting people to have a positive and respectful approach to sexuality and sexual relationships and to have pleasurable and safe sexual experiences, free of infection, coercion, discrimination and violence. The SERVICE also provides access to contraception and signposts Maternity Services to support pregnancy and childbirth. Excludes Genitourinary Medicine Service - see TREATMENT FUNCTION CODE 360 and Midwifery Service - see TREATMENT FUNCTION CODE 560. For further information, see: College of Sexual and Reproductive Healthcare (CoSRH)"
  - code: "505"
    title: "Fetal Medicine Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "SERVICES providing specialist care at a designated centre for the fetus or fetuses and mother. This includes assessment of fetal growth and wellbeing; the diagnosis and management of identified fetal disorders (including fetal abnormalities); prenatal fetal intervention and surgery; and counselling and support for parents. Excludes routine maternity screening activities - see Midwifery Service TREATMENT FUNCTION CODE 560."
  - code: "510"
    title: "Retired"
    heading: "Medical Specialties"
    status: "retired"
    comment: "Record as Obstetrics, antenatal clinic can be used as a local sub-specialty if required"
  - code: "520"
    title: "Retired"
    heading: "Medical Specialties"
    status: "retired"
    comment: "Record as Obstetrics, postnatal clinic can be used as a local sub-specialty if required"
  - code: "610"
    title: "Retired"
    heading: "Medical Specialties"
    status: "retired"
    comment: "Record as Obstetrics"
  - code: "620"
    title: "Retired"
    heading: "Medical Specialties"
    status: "retired"
    comment: "Use the appropriate function under which the patient is treated"
  - code: "834"
    title: "Medical Virology Service"
    heading: "Medical Specialties"
    status: "active"
    comment: "Clinical SERVICES for the diagnosis, management and prevention of blood-borne and/or airborne viral infections. For further information, see: Royal College of Pathologists - MEDICAL VIROLOGY"
  - code: "656"
    title: "Clinical Psychology Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services for the assessment, management and treatment of problems including addiction, anxiety, depression, behavioural difficulties and relationship issues. Methods of assessment include psychometric tests, interviews and direct observation of behaviour. Assessment may lead to advice, counselling or therapy. For further information, see: The British Psychological Society"
  - code: "700"
    title: "Learning Disability Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Also known as Intellectual Disability Service. Mental Health Services provided to PATIENTS with a Learning Disability . For further information, see: Royal College of Psychiatrists - Faculty of the Psychiatry of Intellectual Disability and British Institute of Learning Disabilities"
  - code: "710"
    title: "Adult Mental Health Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services provided to adult PATIENTS for the assessment, diagnosis and treatment of mental illness and maintenance of mental health. For further information, see: Royal College of Psychiatrists - Faculty of General Adult Psychiatry"
  - code: "711"
    title: "Child and Adolescent Psychiatry Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services for children and young people with somatisation and complex presentations, behavioural challenges, eating disorders, mood disorders, anxiety, and other mental health presentations. Excludes Paediatric Neurodisability Service - see TREATMENT FUNCTION CODE 291 and specialist Eating Disorders Service - see TREATMENT FUNCTION CODE 720. For further information, see: Royal College of Psychiatrists - Faculty of Child and Adolescent Psychiatry"
  - code: "712"
    title: "Forensic Psychiatry Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services for the assessment, management and treatment of PATIENTS who are being held in high, medium and low secure units or prisons. This includes prevention of further harm in the community or to the individual themselves. For further information, see: Royal College of Psychiatrists - Faculty of Forensic Psychiatry"
  - code: "713"
    title: "Medical Psychotherapy Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Formerly known as Psychotherapy. Multidisciplinary Mental Health Services to assess, manage and treat children and adults with mental health problems using talking therapies and other psychotherapeutic techniques. For further information, see: Faculty of Medical Psychotherapy"
  - code: "715"
    title: "Old Age Psychiatry Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services providing the specialised assessment, treatment and continuing care for older adults suffering a range of mental illnesses, including dementia, depression or schizophrenia. Excludes specific Dementia Assessment Service - see TREATMENT FUNCTION CODE 727. For further information, see: Royal College of Psychiatrists - Faculty of Old Age Psychiatry"
  - code: "720"
    title: "Eating Disorders Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "A specialist SERVICE for the diagnosis and treatment of eating disorders including anorexia, bulimia and compulsive overeating. This is usually a multidisciplinary service which needs to consider both physical and mental health aspects of the PATIENT 's care. For further information, see: Royal College of Psychiatrists - Faculty of Eating Disorders Psychiatry"
  - code: "721"
    title: "Addiction Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services for the treatment of addictive behaviour, including substance misuse, drugs, alcohol, tobacco and gambling. Excludes PATIENTS with both severe mental illness and problematic substance misuse, see Mental Health Dual Diagnosis Service - TREATMENT FUNCTION CODE 726. For further information, see: Royal College of Psychiatrists - Faculty of Addictions Psychiatry"
  - code: "722"
    title: "Liaison Psychiatry Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services for the provision of psychiatric treatment to PATIENTS attending acute hospitals including Out-Patient Clinics , Emergency Care Departments and admission to WARDS . Deals with the interface between physical and psychological health. For further information, see: Royal College of Psychiatrists - Faculty of Liaison Psychiatry"
  - code: "723"
    title: "Psychiatric Intensive Care Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services provided to vulnerable individuals with severe disturbances who are admitted to Psychiatric Intensive Care Units from mental health acute wards and forensic settings. For further information, see: Royal College of Psychiatrists - Quality Network for Psychiatric Intensive Care Units"
  - code: "724"
    title: "Perinatal Mental Health Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Formerly known as Perinatal Psychiatry. Specialist Mental Health Services for the assessment, management and treatment of pre-existing or new mental health issues during pregnancy or after delivery. For further information, see: Royal College of Psychiatrists - Faculty of Perinatal Psychiatry"
  - code: "725"
    title: "Mental Health Recovery and Rehabilitation Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services provided to support recovery from mental illness that maximises the PATIENTS ' quality of life and social inclusion by encouraging their skills, promoting independence and autonomy. For further information, see: Faculty of Rehabilitation and Social Psychiatry"
  - code: "726"
    title: "Mental Health Dual Diagnosis Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services to provide support to PATIENTS with both severe mental illness and substance misuse problems. For further information, see: Mind: Recreational drugs, alcohol and addiction"
  - code: "727"
    title: "Dementia Assessment Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Designated Mental Health Services for the assessment of PATIENTS who have or are suspected to have dementia. Dementia complicates care giving and can occur at any stage of the illness and at any age. In addition to memory impairment, dementia may include behavioural and psychological problems. For non-specific Old Age Psychiatry Service - see TREATMENT FUNCTION CODE 715. For further information, see: Royal College of Psychiatrists - Dementia pathway"
  - code: "730"
    title: "Neuropsychiatry Service"
    heading: "Mental Health Services"
    status: "active"
    comment: "Mental Health Services for brain disorders and integration of psychiatry within clinical neurosciences. For further information, see: Royal College of Psychiatrists - Faculty of Neuropsychiatry"
  - code: "560"
    title: "Midwifery Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES for managing antenatal and perinatal care during pregnancy, and postnatal care following delivery, provided under the direct care of a MIDWIFE . Excludes Obstetrics Service - see TREATMENT FUNCTION CODE 501. For further information, see: Royal College of Midwives"
  - code: "650"
    title: "Physiotherapy Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES helping PATIENTS affected by injury, illness or DISABILITY through movement and exercise, manual therapy, education and advice to manage pain and prevent disease. To encourage development and facilitate recovery, enabling maintenance of work and independence for as long as possible. For further information, see: Chartered Society of Physiotherapy (CSP) - Physiotherapy"
  - code: "651"
    title: "Occupational Therapy Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES using specific activities to limit the effects of DISABILITY and promote independence in all aspects of daily life"
  - code: "652"
    title: "Speech and Language Therapy Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing assessment, management and treatment of speech, language, communication and swallowing issues in PATIENTS of all ages. For further information, see: Royal College of Speech & Language Therapists - Speech and language therapy"
  - code: "653"
    title: "Podiatry Service"
    heading: "Other Services"
    status: "active"
    comment: "Also known as Chiropody. SERVICES for the diagnosis and treatment of disorders, diseases and deformities of the feet. Excludes Podiatric Surgery Service - see TREATMENT FUNCTION CODE 663. For further information, see: The College of Podiatry"
  - code: "654"
    title: "Dietetics Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES applying the science of nutrition to improve health and treat diseases/conditions by educating and giving practical, personalised advice to PATIENTS , Patient Proxies and other members of the Multidisciplinary Team . They advise on and help to maintain nutritional status during dietary interventions such as exclusion diets and to recommend nutritional supplements. For further information, see: British Dietetic Association"
  - code: "655"
    title: "Orthoptics Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing the diagnosis and treatment of visual problems involving eye movement and alignment. For further information, see: British and Irish Orthoptic Society"
  - code: "657"
    title: "Prosthetics Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing gait analysis and engineering solutions to patients with limb loss. They design and provide prostheses that replicate the structural or functional characteristics of the PATIENTS absent limb. They often work autonomously or part of Multidisciplinary Teams working closely with Physiotherapists and Occupational Therapists as part of multidisciplinary amputee rehabilitation teams. For further information, see: British Association of Prosthetists and Orthotists (BAPO) - Prosthetists"
  - code: "658"
    title: "Orthotics Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing gait analysis and engineering solutions to PATIENTS with needs of the neuro, muscular and skeletal systems. They design and provide orthoses that modify the structural or functional characteristics of the PATIENTS neuro-muscular and skeletal systems enabling patients to mobilise, eliminate gait deviations, reduce falls, reduce pain, prevent and facilitate healing of ulcers. They often work autonomously or part of Multidisciplinary Teams such as within the diabetic foot team or neuro-rehabilitation team. For further information, see: The British Association of Prosthetists and Orthotists (BAPO) - Orthotists"
  - code: "659"
    title: "Dramatherapy Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing dramatherapy which is a form of psychological therapy focussing on the use of performance arts within the therapeutic relationship. For further information, see: British Association of Dramatherapists"
  - code: "660"
    title: "Art Therapy Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES delivering a form of psychotherapy that uses art media as its primary mode of expression and communication. Within this context, art is not used as diagnostic tool but as a medium to address emotional issues which may be confusing and distressing. For further information, see: British Association of Art Therapists"
  - code: "661"
    title: "Music Therapy Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES delivering a form of psychotherapy that uses music to support psychological, emotional, cognitive, physical, communicative and/or social needs. For further information, see: British Association for Music Therapy"
  - code: "662"
    title: "Optometry Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing the diagnosis and non-surgical treatment of disorders of the eye and vision care"
  - code: "663"
    title: "Podiatric Surgery Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES involved in the complex management of the foot and ankle involving surgery under both local and general anaesthetic. Excludes Podiatry Service - see TREATMENT FUNCTION CODE - 653. For further information, see: The College of Podiatry"
  - code: "670"
    title: "Urological Physiology Service"
    heading: "Other Services"
    status: "active"
    comment: "Diagnostic SERVICES for the study of erectile, upper and lower urinary tract function, including urodynamics. For further information, see: The British Association of Urological Surgeons"
  - code: "673"
    title: "Vascular Physiology Service"
    heading: "Other Services"
    status: "active"
    comment: "Diagnostic SERVICES for the study of arterial and venous circulation primarily using Doppler ultrasound but including tests such as pressure measurement and plethysmography. Excludes Cardiac Physiology Service - see TREATMENT FUNCTION CODE 675. For further information, see: The Society for Vascular Technology"
  - code: "675"
    title: "Cardiac Physiology Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing physiological measurements of the heart structure/function and response to therapeutic/surgical intervention through the means of a wide spectrum of non-invasive and invasive cardiac diagnostic testing. Examples include echocardiography, cardiac device management. For further information, see: Society for Cardiological Science and Technology (SCST)"
  - code: "677"
    title: "Gastrointestinal Physiology Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing physiological measurement of the gastrointestinal tract. This includes standard catheter based oesophageal pH studies, oesophageal pH impedance, oesophageal manometry, ano-rectal manometry, wireless capsule studies. Excludes Gastroenterology Service - see TREATMENT FUNCTION CODE 301. For further information, see: BSG - British Society of Gastroenterology"
  - code: "800"
    title: "Clinical Oncology Service"
    heading: "Other Services"
    status: "active"
    comment: "Formerly known as Radiotherapy. The diagnosis and treatment, typically with Radiotherapy , of PATIENTS with cancer. For further information, see: Royal College of Radiologists - Clinical oncology"
  - code: "811"
    title: "Interventional Radiology Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES delivering a range of techniques using radiological image guidance including X-ray fluoroscopy, ultrasound, Computerised Tomography Scan , or Magnetic Resonance Imaging Scan (MRI) to precisely target therapy. Excludes Interventional Cardiology - see Cardiology Service TREATMENT FUNCTION CODE 320, and Diagnostic Imaging Service - see TREATMENT FUNCTION CODE 812. For further information, see: British Society of Interventional Radiology - What is Interventional Radiology"
  - code: "812"
    title: "Diagnostic Imaging Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing medical imaging, especially X-ray based examinations, Ultrasound scan, MRI Scan , PET Scan or CT Scan . Diagnostic imaging is used to confirm, assess and document diseases, as well as to assess responses to treatment. For further information, see: WHO: Diagnostic imaging"
  - code: "822"
    title: "Chemical Pathology Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES interpreting biochemical investigation results to assess, diagnose and treat diseases. To be used for the clinical management of PATIENTS by chemical pathology only. For further information, see: Royal College of Pathologists - CHEMICAL PATHOLOGY"
  - code: "832"
    title: "Retired"
    heading: "Other Services"
    status: "retired"
  - code: "840"
    title: "Audiology Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing physiological measurement and diagnosis of hearing disorders, and the rehabilitation of PATIENTS with hearing loss. Include hearing services activity, such as hearing tests and the fitting of hearing aids. For further information, see: British Society of Audiology"
  - code: "920"
    title: "Diabetic Education Service"
    heading: "Other Services"
    status: "active"
    comment: "SERVICES providing dedicated small group education courses regarding self-management for diabetic PATIENTS"
  - code: "990"
    title: "Retired"
    heading: "Other Services"
    status: "retired"
